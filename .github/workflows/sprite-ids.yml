name: Sprite ids
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reads only the client jar's file listing (HTTP range requests); no assets are stored.
      - run: pnpm --filter cobble-ui sprite-ids:check
